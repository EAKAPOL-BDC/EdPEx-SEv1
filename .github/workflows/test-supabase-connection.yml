name: Test Supabase connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a manual run from main
        run: |
          python - <<'PY'
          import os
          if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch" or os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("Run this development connection check manually from main.")
          PY

  select-one:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run read-only connection check
        env:
          SUPABASE_DEV_DB_HOST: ${{ secrets.SUPABASE_DEV_DB_HOST }}
          SUPABASE_DEV_DB_PORT: ${{ secrets.SUPABASE_DEV_DB_PORT }}
          SUPABASE_DEV_DB_NAME: ${{ secrets.SUPABASE_DEV_DB_NAME }}
          SUPABASE_DEV_DB_USER: ${{ secrets.SUPABASE_DEV_DB_USER }}
          SUPABASE_DEV_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: python scripts/check_supabase_connection.py
