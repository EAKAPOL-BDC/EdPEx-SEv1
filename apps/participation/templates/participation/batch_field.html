<div class="batch-field{% if field.errors %} has-error{% endif %}">
{% if field.field.widget.allow_multiple_selected %}<fieldset class="batch-group-options"><legend>{{ field.label }}</legend>{{ field }}</fieldset>{% elif field.field.widget.input_type == 'checkbox' %}<label class="batch-check">{{ field }} {{ field.label }}</label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% endif %}
{% if field.help_text %}<p class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}{{ field.errors }}</div>
