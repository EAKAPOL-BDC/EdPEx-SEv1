<p class="eyebrow">YOUR EXPERIENCE MATTERS</p><h1 data-th="เข้าประเมินด้วยคำเชิญ" data-en="Enter with your invitation"></h1><p data-th="ไม่ต้องสมัครสมาชิก ไม่กรอกชื่อหรืออีเมล กลุ่มและแบบประเมินกำหนดจากคำเชิญ" data-en="No account, name or email required. Your invitation determines the respondent group and assessment."></p>
<section class="connection-panel"><label for="entry-code" data-th="รหัสเชิญแบบใช้ครั้งเดียว" data-en="Single-use invitation code"></label><input id="entry-code" type="text" maxlength="69" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="NXA1-…"><p data-th="หนึ่งรหัสใช้ส่งคำตอบได้หนึ่งครั้ง เก็บรหัสไว้กับท่าน การส่งต่อรหัสคือการให้ผู้อื่นใช้สิทธิ์นี้" data-en="One code permits one submission. Keep it private. Sharing the code lets another person use this invitation."></p><div class="connection-actions"><button id="entry-start" class="primary" type="button" data-th="เปิดแบบประเมิน →" data-en="Open assessment →"></button><a href="/survey/participation/receipt/" data-th="เคยส่งแล้ว · ตรวจหลักฐาน" data-en="Already submitted? Check receipt"></a></div><p id="entry-status" role="status" aria-live="polite"></p></section>
<p><a href="/survey/" data-th="รหัสไม่ได้ขึ้นต้น NXA1 · ใช้ช่องทางรหัสเดิม" data-en="Code does not start with NXA1? Use the earlier entry"></a></p>
<details class="instructions"><summary data-th="คำเชิญนี้ทำงานอย่างไร" data-en="How this invitation works"></summary><p data-th="ระบบเก็บเฉพาะค่าแฮชของรหัสและสถานะสิทธิ์ ไม่บันทึกว่ารหัสนี้แจกให้ใคร จึงป้องกันการใช้รหัสเดิมส่งซ้ำได้ แต่ไม่ยืนยันตัวบุคคลหรือรับรองว่าหนึ่งคนได้รับเพียงหนึ่งรหัส" data-en="The system stores a code hash and access state, without recording its recipient. It prevents reuse of this code, but does not identify a person or guarantee that each person receives only one code."></p><p data-th="เปิดคำเชิญเดิมอีกครั้งจะเปลี่ยนช่วงการตอบเดิม คำตอบที่ยังไม่ส่งไม่ถูกเก็บไว้ ข้อมูลโครงสร้างพื้นฐานและเวลาอาจยังเชื่อมโยงเหตุการณ์ได้" data-en="Reopening an invitation replaces its earlier session. Unsubmitted answers are not retained. Infrastructure and timing data may still correlate events."></p></details>
<p class="muted" data-th="รอบทดสอบเท่านั้น · ใช้ข้อมูลสมมุติ ลิงก์ในเครื่องยังไม่รองรับการเปิดจากโทรศัพท์" data-en="Test collection only · use synthetic data. A local link cannot be opened from a phone."></p></main><footer><strong>NEXORA</strong><p data-th="เชื่อมโยงข้อมูล ขับเคลื่อนองค์กรสู่ความเป็นเลิศ" data-en="Connecting information. Driving organizational excellence."></p><small>School of Education University of Phayao · Mr.Eakapol Bodhichandra<br>© 2026 NEXORA</small></footer><noscript>โปรดเปิด JavaScript / Please enable JavaScript.</noscript><script id="preview-data" type="application/json">/* PREVIEW_DATA */</script><script>/* PREVIEW_JS */</script></body></html>
